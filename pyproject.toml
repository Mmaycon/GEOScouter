[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoscouter"
version = "0.3.0"
description = "Explore and compare GEO series datasets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "GEOparse>=2.0",
    "networkx>=3.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "matplotlib>=3.7", "seaborn>=0.13", "xlsxwriter>=3.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["geoscouter*"]
